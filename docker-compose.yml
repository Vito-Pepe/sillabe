services:
  sillabe:
    build: .
    ports:
      # 8080 esposto su tutte le interfacce: raggiungibile sia dalla LAN
      # (http://IP-DEL-PI:8080) sia da remoto tramite Tailscale, che
      # pubblica in piu' lo stesso servizio in HTTPS sulla tailnet
      # (tailscale serve, vedi TAILSCALE.md).
      - "8080:80"
    # Se nginx non risponde per 3 controlli di fila, Docker segna il container "unhealthy"
    # e il guardiano del Pi (repo guardiano) lo riavvia
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Watchtower aggiorna automaticamente il container quando pubblichi una nuova immagine.
  # Scommenta le righe qui sotto per abilitarlo (richiede che l'immagine venga pubblicata
  # su un registry come Docker Hub o GHCR).
  #
  # watchtower:
  #   image: containrrr/watchtower
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   command: --interval 300   # controlla ogni 5 minuti
  #   restart: unless-stopped
